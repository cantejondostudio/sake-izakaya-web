# Despliegue en Netlify — Sake Izakaya (web premium, Next.js 16 App Router).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 necesita Node moderno; fijamos 22 para evitar sorpresas.
  NODE_VERSION = "22"

# Adaptador oficial de Next.js para Netlify: habilita el renderizado del
# servidor y las rutas API (p. ej. /api/reserva) como funciones serverless.
# Netlify lo instala al detectar Next; lo dejamos explícito por claridad.
[[plugins]]
  package = "@netlify/plugin-nextjs"
